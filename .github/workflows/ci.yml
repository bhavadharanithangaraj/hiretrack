name: CI

# Run on every push and every pull request, on any branch
on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven # reuse downloaded dependencies between runs

      - name: Run tests
        run: mvn -B test

      # If tests fail, keep the reports so you can download them from the Actions page
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  frontend-build:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (includes TypeScript check)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
