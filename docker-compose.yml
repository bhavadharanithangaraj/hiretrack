services:
  postgres:
    image: postgres:16-alpine
    container_name: hiretrack-postgres
    environment:
      POSTGRES_DB: hiretrack
      POSTGRES_USER: hiretrack
      POSTGRES_PASSWORD: hiretrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
