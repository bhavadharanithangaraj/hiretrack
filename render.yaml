# Render "Blueprint": tells Render how to deploy the backend from this repo.
# In Render: New + -> Blueprint -> pick this repo. Values marked "sync: false" are asked for once.
services:
  - type: web
    name: hiretrack-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      # From Neon, e.g. jdbc:postgresql://ep-xxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Your Vercel URL, e.g. https://hiretrack-abc.vercel.app (no trailing slash)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Render creates a long random secret for us
      - key: JWT_SECRET
        generateValue: true
