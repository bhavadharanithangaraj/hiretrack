spring.application.name=hiretrack-backend
# Hosting platforms like Render tell the app which port to use via the PORT variable
server.port=${PORT:8080}

# Database - values come from environment variables, with local defaults.
# In Docker, docker-compose sets DB_URL to point at the "postgres" container.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hiretrack}
spring.datasource.username=${DB_USERNAME:hiretrack}
spring.datasource.password=${DB_PASSWORD:hiretrack}

# Hibernate creates/updates tables from the @Entity classes automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT - override JWT_SECRET in production! Must be at least 32 characters (256 bits) for HS256.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-hiretrack-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin account created on startup (if it doesn't exist yet)
app.admin.email=${ADMIN_EMAIL:admin@hiretrack.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# Frontend origin allowed to call the API from the browser (CORS)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
